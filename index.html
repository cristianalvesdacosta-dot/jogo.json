<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveGol | Player Profissional</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/dplayer@latest/dist/DPlayer.min.js"></script>
    <style>
        :root { --verde: #22c55e; --fundo: #050505; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--fundo); color: white; margin: 0; padding: 0; }
        .container { width: 100%; max-width: 450px; margin: auto; min-height: 100vh; display: flex; flex-direction: column; }
        
        /* Estilo do Player (Simulando VLC) */
        #dplayer { width: 100%; aspect-ratio: 16/9; background: #000; }

        .header { padding: 15px; text-align: center; background: #111; border-bottom: 2px solid var(--verde); }
        .logo { font-size: 24px; font-weight: 900; font-style: italic; margin: 0; }
        .verde { color: var(--verde); }

        .placar { padding: 15px; background: #111; margin: 10px; border-radius: 12px; border: 1px solid #222; }
        .times { display: flex; justify-content: space-around; align-items: center; }
        .time { text-align: center; width: 30%; }
        .time img { width: 45px; height: 45px; object-fit: contain; }
        .time p { font-size: 11px; font-weight: bold; margin-top: 5px; text-transform: uppercase; }
        
        .vs-box { text-align: center; }
        .live-tag { background: var(--verde); color: #000; font-size: 9px; font-weight: 900; padding: 2px 6px; border-radius: 3px; }

        .footer { margin-top: auto; padding: 20px; }
        .btn-pix { background: var(--verde); color: #000; border: none; padding: 18px; width: 100%; border-radius: 10px; font-weight: 900; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <header class="header"><h1 class="logo">⚽ LIVE<span class="verde">GOL</span></h1></header>

    <div id="dplayer"></div>
    
    <div id="msg" style="padding:10px; font-size:12px; text-align:center; color:var(--verde);">Conectando ao sinal...</div>

    <div class="placar">
        <div class="times">
            <div class="time"><img id="img_c"><p id="txt_c"></p></div>
            <div class="vs-box"><div style="color:var(--verde); font-weight:900;">VS</div><div class="live-tag">AO VIVO</div></div>
            <div class="time"><img id="img_f"><p id="txt_f"></p></div>
        </div>
    </div>

    <div class="footer"><button class="btn-pix" onclick="copiarPix()">APOIAR VIA PIX</button></div>
</div>

<script>
    const JSON_URL = "https://raw.githubusercontent.com/cristianalvesdacosta-dot/jogo.json/main/jogo.json";

    async function carregar() {
        try {
            const res = await fetch(`${JSON_URL}?v=${Date.now()}`);
            const d = await res.json();
            
            document.getElementById('txt_c').innerText = d.timeCasa;
            document.getElementById('img_c').src = d.logoCasa;
            document.getElementById('txt_f').innerText = d.timeFora;
            document.getElementById('img_f').src = d.logoFora;
            window.chavePix = d.pix;

            // CONFIGURAÇÃO DO PLAYER (ESTILO VLC)
            const dp = new DPlayer({
                container: document.getElementById('dplayer'),
                live: true,
                autoplay: true,
                theme: '#22c55e',
                video: {
                    url: "https://api.allorigins.win/raw?url=" + encodeURIComponent(d.linkVideo),
                    type: 'hls',
                },
                pluginOptions: {
                    hls: {
                        xhrSetup: function (xhr) {
                            xhr.withCredentials = false;
                        }
                    }
                }
            });

            dp.on('canplay', () => {
                document.getElementById('msg').innerText = "Sinal Estabilizado ✅";
                dp.play();
            });

            dp.on('error', () => {
                document.getElementById('msg').innerText = "Erro: O servidor bloqueou o acesso do site. ❌";
            });

        } catch (e) {
            console.error(e);
        }
    }

    function copiarPix() { 
        navigator.clipboard.writeText(window.chavePix); 
        alert("PIX Copiado!"); 
    }

    carregar();
</script>

</body>
</html>
