<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveGol | Oficial</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --verde: #22c55e; --fundo: #0a0a0a; }
        body { background: var(--fundo); color: #fff; font-family: sans-serif; margin: 0; text-align: center; }
        .container { width: 100%; max-width: 450px; margin: auto; padding-bottom: 20px; }
        .header { padding: 15px; border-bottom: 2px solid var(--verde); background: #111; font-style: italic; }
        video { width: 100%; aspect-ratio: 16/9; background: #000; display: block; }
        .apoio { padding: 10px; font-size: 13px; color: var(--verde); background: rgba(34, 197, 94, 0.1); margin: 10px; border-radius: 5px; }
        .placar { background: #111; margin: 10px; padding: 15px; border-radius: 12px; border: 1px solid #222; }
        .times { display: flex; justify-content: space-around; align-items: center; }
        .time img { width: 55px; height: 55px; object-fit: contain; }
        .time p { font-size: 12px; font-weight: bold; margin: 5px 0; text-transform: uppercase; }
        .vs { color: var(--verde); font-weight: 900; font-size: 18px; }
        .banner-ads { margin: 10px; border-radius: 8px; overflow: hidden; display: none; border: 1px solid #333; }
        .banner-ads img { width: 100%; display: block; }
        .btn-pix { background: var(--verde); color: #000; border: none; padding: 18px; width: 90%; border-radius: 10px; font-weight: 900; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <header class="header"><h1>⚽ LIVE<span style="color:var(--verde)">GOL</span></h1></header>
    <video id="video" controls autoplay playsinline></video>
    <div id="status" style="font-size:11px; color:#666; padding:5px;">Conectando...</div>
    <div class="apoio" id="msg_apoio"></div>
    <div class="placar">
        <div class="times">
            <div class="time"><img id="l_c"><p id="n_c"></p></div>
            <div style="text-align:center;"><div class="vs">VS</div><div style="font-size:9px; background:var(--verde); color:#000; padding:2px; border-radius:3px;">AO VIVO</div></div>
            <div class="time"><img id="l_f"><p id="n_f"></p></div>
        </div>
        <div id="data_jogo" style="font-size:11px; color:#888; margin-top:10px;"></div>
    </div>
    <div id="area_banner" class="banner-ads"><a id="link_banner" href="#" target="_blank"><img id="img_banner"></a></div>
    <button class="btn-pix" onclick="copiarPix()">APOIAR VIA PIX</button>
</div>

<script>
    // ############################################################
    // #        PAINEL DE EDIÇÃO - ALTERE OS DADOS ABAIXO         #
    // ############################################################

    const EDITAR_AQUI = {
        timeCasa:    "REMO",                       // Nome do time 1
        logoCasa:    "https://raw.githubusercontent.com/cristianalvesdacosta-dot/jogo.json/0823f9dc65aa5ad0cc94741ae30f4f6b51ea3c2a/logos/Clube_do_Remo.svg.png",  // Logo do time 1
        
        timeFora:    "PAYSANDU",                   // Nome do time 2
        logoFora:    "https://raw.githubusercontent.com/cristianalvesdacosta-dot/jogo.json/refs/heads/main/logos/Gremio_logo.svg.png", // Logo do time 2
        
        dataHora:    "Hoje às 20:30",              // Data e Hora do jogo
        fraseApoio:  "Fortaleça nossa live via PIX!", // Frase de incentivo
        pix:         "c09be774-91cc-421f-8cd7-23d8a28d4a07",             // Sua chave PIX
        
        linkVideo:   "COLE_AQUI_O_LINK_M3U8",      // Link do sinal (M3U8)

        bannerUrl:   "",                           // Link da imagem do Banner (se tiver)
        linkBanner:  ""                            // Link que abre ao clicar no Banner
    };

    // ############################################################
    // #      DAQUI PARA BAIXO NÃO PRECISA MEXER EM NADA          #
    // ############################################################

    function carregar() {
        document.getElementById('n_c').innerText = EDITAR_AQUI.timeCasa;
        document.getElementById('l_c').src = EDITAR_AQUI.logoCasa;
        document.getElementById('n_f').innerText = EDITAR_AQUI.timeFora;
        document.getElementById('l_f').src = EDITAR_AQUI.logoFora;
        document.getElementById('data_jogo').innerText = EDITAR_AQUI.dataHora;
        document.getElementById('msg_apoio').innerText = EDITAR_AQUI.fraseApoio;

        if(EDITAR_AQUI.bannerUrl !== "") {
            document.getElementById('area_banner').style.display = 'block';
            document.getElementById('img_banner').src = EDITAR_AQUI.bannerUrl;
            document.getElementById('link_banner').href = EDITAR_AQUI.linkBanner;
        }

        const v = document.getElementById('video');
        const proxy = "https://api.allorigins.win/raw?url=" + encodeURIComponent(EDITAR_AQUI.linkVideo);

        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(proxy);
            hls.attachMedia(v);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                document.getElementById('status').innerText = "Sinal Online ✅";
                v.play();
            });
        }
    }
    function copiarPix() { navigator.clipboard.writeText(EDITAR_AQUI.pix); alert("PIX Copiado!"); }
    window.onload = carregar;
</script>
</body>
</html>
