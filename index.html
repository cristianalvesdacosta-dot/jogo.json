<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transmissão Ao Vivo</title>
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0f172a; color: white; text-align: center; margin: 0; padding: 10px; }
        .card { max-width: 500px; margin: auto; background: #1e293b; border-radius: 24px; padding: 25px; margin-top: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        .status { color: #ef4444; font-weight: bold; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 5px; margin-bottom: 5px; }
        .dot { height: 8px; width: 8px; background-color: #ef4444; border-radius: 50%; display: inline-block; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        .data-hora { font-size: 13px; color: #94a3b8; margin-bottom: 20px; }
        .confronto { display: flex; justify-content: space-around; align-items: center; margin-bottom: 25px; }
        .time { width: 40%; }
        .time img { width: 80px; height: 80px; object-fit: contain; margin-bottom: 10px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); }
        .time p { font-weight: 600; margin: 0; font-size: 15px; text-transform: uppercase; }
        .vs { font-size: 22px; font-weight: 900; color: #f8fafc; font-style: italic; }
        .video-container { position: relative; width: 100%; border-radius: 15px; overflow: hidden; background: #000; border: 1px solid #475569; margin-top: 10px; }
        video { width: 100%; display: block; outline: none; }
        .btn-pix { background: #22c55e; color: white; border: none; padding: 18px; width: 100%; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 25px; font-size: 17px; box-shadow: 0 5px 0 #166534; transition: all 0.2s; }
        .btn-pix:active { transform: translateY(3px); box-shadow: 0 2px 0 #166534; }
        .instrucao { font-size: 11px; color: #64748b; margin-top: 15px; line-height: 1.4; }
        #loading { margin-top: 150px; font-size: 18px; color: #94a3b8; font-weight: 300; }
    </style>
</head>
<body>

    <div id="loading">A ligar ao sinal...</div>

    <div class="card" id="conteudo" style="display:none;">
        <div class="status"><span class="dot"></span> AO VIVO</div>
        <div id="data_jogo" class="data-hora"></div>

        <div class="confronto">
            <div class="time">
                <img id="img_casa" src=""><p id="nome_casa"></p>
            </div>
            <div class="vs">VS</div>
            <div class="time">
                <img id="img_fora" src=""><p id="nome_fora"></p>
            </div>
        </div>

        <div class="video-container">
            <video id="video" controls playsinline poster="https://img.freepik.com/fotos-premium/fundo-de-textura-de-grama-de-campo-de-futebol-estadio-de-futebol-fundo-de-futebol_555009-3221.jpg"></video>
        </div>

        <button class="btn-pix" onclick="copyPix()">APOIAR COM PIX (QUALQUER VALOR)</button>
        <div class="instrucao">Ao clicar, o código será copiado.<br>Abra a app do seu banco e use "Pix Copia e Cola".</div>
    </div>

    <script>
        // Link que lê o seu ficheiro de dados
        const linkDados = "https://raw.githubusercontent.com/cristianalvesdacosta-dot/jogo.json/main/jogo.json";

        async function iniciarApp() {
            try {
                const resposta = await fetch(linkDados + "?t=" + new Date().getTime());
                const dados = await resposta.json();

                document.getElementById('nome_casa').innerText = dados.timeCasa;
                document.getElementById('img_casa').src = dados.logoCasa;
                document.getElementById('nome_fora').innerText = dados.timeFora;
                document.getElementById('img_fora').src = dados.logoFora;
                document.getElementById('data_jogo').innerText = dados.dataHora;
                window.chavePix = dados.pix;

                const video = document.getElementById('video');
                const sinalURL = dados.linkVideo;

                if (Hls.isSupported()) {
                    const hls = new Hls();
                    hls.loadSource(sinalURL);
                    hls.attachMedia(video);
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = sinalURL;
                }

                document.getElementById('loading').style.display = 'none';
                document.getElementById('conteudo').style.display = 'block';
            } catch (erro) {
                document.getElementById('loading').innerText = "Transmissão indisponível de momento.";
                console.error(erro);
            }
        }

        function copyPix() {
            const el = document.createElement('textarea');
            el.value = window.chavePix;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            alert("Código PIX copiado com sucesso!");
        }

        iniciarApp();
    </script>
</body>
</html>
