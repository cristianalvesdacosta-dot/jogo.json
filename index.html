<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveGol | Ao Vivo</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --verde: #22c55e; --fundo: #0a0a0a; --card: #171717; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--fundo); color: white; margin: 0; padding: 0; }
        .container { width: 100%; max-width: 450px; margin: auto; min-height: 100vh; display: flex; flex-direction: column; }
        
        .header-banner { padding: 15px; text-align: center; background: #111; border-bottom: 2px solid var(--verde); display: flex; justify-content: center; align-items: center; gap: 8px; }
        .logo-texto { font-size: 26px; font-weight: 900; font-style: italic; margin: 0; }
        .cor-verde { color: var(--verde); }

        .video-box { width: 100%; background: #000; aspect-ratio: 16/9; }
        video { width: 100%; height: 100%; display: block; }

        .apoio-box { padding: 12px; background: #1a1a1a; margin: 10px 15px; border-radius: 8px; border: 1px solid #333; text-align: center; font-size: 13px; }

        .placar { padding: 15px 10px; background: var(--card); margin: 5px 15px; border-radius: 12px; border: 1px solid #262626; }
        .times-row { display: flex; justify-content: space-around; align-items: center; }
        .time-bloco { width: 35%; text-align: center; }
        .time-bloco img { width: 50px; height: 50px; object-fit: contain; }
        .time-bloco p { font-weight: bold; font-size: 12px; margin: 5px 0 0 0; text-transform: uppercase; }
        .live-tag { background: var(--verde); color: black; font-size: 9px; font-weight: 900; padding: 2px 5px; border-radius: 3px; }

        /* ÁREA DE PARCERIA / ANÚNCIO (O ESPAÇO PRETO QUE VOCÊ MARCOU) */
        .ads-area { padding: 0 15px; margin: 10px 0; display: none; } /* Começa escondida */
        .ads-box { width: 100%; background: #111; border: 1px dashed #444; border-radius: 10px; overflow: hidden; text-align: center; }
        .ads-box img { width: 100%; display: block; }

        .pix-area { margin-top: auto; padding: 20px; background: #111; border-top: 1px solid #262626; }
        .btn-pix { background: var(--verde); color: black; border: none; padding: 18px; width: 100%; border-radius: 10px; font-weight: 900; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <header class="header-banner"><h1 class="logo-texto">⚽ Live<span class="cor-verde">Gol</span></h1></header>

        <div class="video-box"><video id="video" controls playsinline></video></div>
        
        <div class="apoio-box"><p id="texto_incentivo"></p></div>

        <div class="placar">
            <div class="times-row">
                <div class="time-bloco"><img id="img_casa"><p id="nome_casa"></p></div>
                <div><div style="color:var(--verde); font-weight:900;">VS</div><div class="live-tag">AO VIVO</div></div>
                <div class="time-bloco"><img id="img_fora"><p id="nome_fora"></p></div>
            </div>
            <div id="data_hora_jogo" style="text-align:center; font-size:11px; color:#888; margin-top:10px;"></div>
        </div>

        <div id="container_ads" class="ads-area">
            <div class="ads-box">
                <a id="link_ads" href="#" target="_blank">
                    <img id="img_ads" src="" alt="Parceiro LiveGol">
                </a>
            </div>
        </div>

        <div class="pix-area"><button class="btn-pix" onclick="copiarPix()">APOIAR TRANSMISSÃO (PIX)</button></div>
    </div>

    <script>
        async function carregar() {
            const res = await fetch("https://raw.githubusercontent.com/cristianalvesdacosta-dot/jogo.json/main/jogo.json?v=" + Date.now());
            const d = await res.json();
            
            document.getElementById('nome_casa').innerText = d.timeCasa;
            document.getElementById('img_casa').src = d.logoCasa;
            document.getElementById('nome_fora').innerText = d.timeFora;
            document.getElementById('img_fora').src = d.logoFora;
            document.getElementById('data_hora_jogo').innerText = d.dataHora;
            document.getElementById('texto_incentivo').innerText = d.mensagemIncentivo;
            window.chavePix = d.pix;

            // LÓGICA DO BANNER DE PARCERIA
            if (d.urlBanner && d.urlBanner !== "") {
                document.getElementById('container_ads').style.display = 'block';
                document.getElementById('img_ads').src = d.urlBanner;
                document.getElementById('link_ads').href = d.linkParceiro || "#";
            }

            const v = document.getElementById('video');
            if (Hls.isSupported()) {
                const hls = new Hls(); hls.loadSource(d.linkVideo); hls.attachMedia(v);
            } else if (v.canPlayType('application/vnd.apple.mpegurl')) {
                v.src = d.linkVideo;
            }
        }
        function copiarPix() { navigator.clipboard.writeText(window.chavePix); alert("PIX Copiado!"); }
        carregar();
    </script>
</body>
</html>
