<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveGol | HiltonNet</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --verde-neon: #22c55e;
            --fundo-dark: #0a0a0a;
            --card-dark: #171717;
            --texto-cinza: #a3a3a3;
        }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: var(--fundo-dark); 
            color: white; 
            margin: 0; 
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: var(--fundo-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER COM LOGO LIVEGOL */
        .header {
            padding: 20px;
            text-align: center;
            background: linear-gradient(to bottom, #111, var(--fundo-dark));
            border-bottom: 1px solid #262626;
        }

        .logo-livegol {
            height: 45px;
            filter: drop-shadow(0 0 5px rgba(34, 197, 94, 0.3));
        }

        /* AREA DO VIDEO */
        .video-box {
            width: 100%;
            background: #000;
            line-height: 0;
            border-bottom: 2px solid var(--verde-neon);
        }

        video { width: 100%; outline: none; }

        /* CARD DE PLACAR */
        .placar-container {
            padding: 25px 15px;
            background: var(--card-dark);
            margin: 15px;
            border-radius: 15px;
            border: 1px solid #262626;
        }

        .times-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .time-bloco { width: 35%; text-align: center; }
        .time-bloco img { width: 65px; height: 65px; object-fit: contain; margin-bottom: 10px; }
        .time-bloco p { font-weight: bold; font-size: 14px; margin: 0; text-transform: uppercase; letter-spacing: 1px; }

        .vs-bloco { text-align: center; }
        .vs-texto { font-size: 24px; font-weight: 900; color: var(--verde-neon); font-style: italic; }
        .badge-live { 
            background: var(--verde-neon); 
            color: black; 
            font-size: 10px; 
            font-weight: 900; 
            padding: 2px 8px; 
            border-radius: 4px; 
            margin-top: 5px;
            animation: blink 1.2s infinite;
        }

        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* INFO DO JOGO */
        .game-details { padding: 0 20px; text-align: left; }
        .game-details h1 { font-size: 18px; margin: 0; color: white; }
        .game-details p { font-size: 13px; color: var(--texto-cinza); margin: 5px 0 0 0; }

        /* SEÇÃO PIX PROFISSIONAL */
        .pix-area {
            margin-top: auto;
            padding: 20px;
            background: #111;
            border-top: 1px solid #262626;
        }

        .pix-label { font-size: 12px; color: var(--texto-cinza); text-transform: uppercase; margin-bottom: 10px; display: block; }
        
        .pix-box {
            background: #1e1e1e;
            padding: 12px;
            border-radius: 8px;
            font-size: 11px;
            color: #888;
            border: 1px dashed #444;
            margin-bottom: 15px;
            word-break: break-all;
        }

        .btn-pix {
            background: var(--verde-neon);
            color: black;
            border: none;
            padding: 18px;
            width: 100%;
            border-radius: 10px;
            font-weight: 900;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
            transition: 0.2s;
        }

        .btn-pix:active { transform: scale(0.98); }

        #loading { display: flex; align-items: center; justify-content: center; height: 100vh; color: var(--verde-neon); font-weight: bold; }
    </style>
</head>
<body>

    <div id="loading">CARREGANDO LIVEGOL...</div>

    <div class="container" id="conteudo" style="display:none;">
        <header class="header">
            <img src="https://img001.prntscr.com/file/img001/Pj6A2C59T3-xYk_E-h_6hA.png" class="logo-livegol" alt="LiveGol">
        </header>

        <div class="video-box">
            <video id="video" controls playsinline></video>
        </div>

        <div class="placar-container">
            <div class="times-row">
                <div class="time-bloco">
                    <img id="img_casa" src=""><p id="nome_casa"></p>
                </div>
                <div class="vs-bloco">
                    <div class="vs-texto">VS</div>
                    <div class="badge-live">AO VIVO</div>
                </div>
                <div class="time-bloco">
                    <img id="img_fora" src=""><p id="nome_fora"></p>
                </div>
            </div>
        </div>

        <div class="game-details">
            <h1 id="titulo_jogo">NOME DO JOGO</h1>
            <p id="data_jogo">Horário da Transmissão</p>
        </div>

        <div class="pix-area">
            <span class="pix-label">Apoie a transmissão via PIX</span>
            <div class="pix-box" id="pix_text">Carregando chave...</div>
            <button class="btn-pix" onclick="copiarPix()">COPIAR PIX COPIA E COLA</button>
        </div>
    </div>

    <script>
        const jsonUrl = "https://raw.githubusercontent.com/cristianalvesdacosta-dot/jogo.json/main/jogo.json";

        async function init() {
            try {
                const res = await fetch(jsonUrl + "?v=" + Date.now());
                const data = await res.json();

                document.getElementById('nome_casa').innerText = data.timeCasa;
                document.getElementById('img_casa').src = data.logoCasa;
                document.getElementById('nome_fora').innerText = data.timeFora;
                document.getElementById('img_fora').src = data.logoFora;
                document.getElementById('titulo_jogo').innerText = data.timeCasa + " x " + data.timeFora;
                document.getElementById('data_jogo').innerText = data.dataHora;
                document.getElementById('pix_text').innerText = data.pix;
                window.chavePix = data.pix;

                const video = document.getElementById('video');
                if (Hls.isSupported()) {
                    const hls = new Hls();
                    hls.loadSource(data.linkVideo);
                    hls.attachMedia(video);
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = data.linkVideo;
                }

                document.getElementById('loading').style.display = 'none';
                document.getElementById('conteudo').style.display = 'flex';
            } catch (e) {
                document.getElementById('loading').innerText = "ERRO AO CARREGAR SINAL.";
            }
        }

        function copiarPix() {
            navigator.clipboard.writeText(window.chavePix);
            alert("Chave PIX copiada! Obrigado pelo apoio.");
        }

        init();
    </script>
</body>
</html>
