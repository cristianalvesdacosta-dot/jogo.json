<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveGol | Oficial</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; text-align: center; }
        .container { width: 100%; max-width: 450px; margin: auto; }
        .header { padding: 15px; border-bottom: 2px solid #22c55e; background: #111; font-style: italic; }
        video { width: 100%; aspect-ratio: 16/9; background: #111; display: block; }
        .placar { background: #111; margin: 15px; padding: 20px; border-radius: 12px; border: 1px solid #222; }
        .times { display: flex; justify-content: space-around; align-items: center; }
        .time img { width: 60px; height: 60px; object-fit: contain; }
        .vs { color: #22c55e; font-weight: 900; font-size: 20px; }
        .btn-pix { background: #22c55e; color: #000; border: none; padding: 18px; width: 90%; border-radius: 10px; font-weight: 900; font-size: 16px; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <header class="header"><h1>⚽ LIVE<span style="color:#22c55e">GOL</span></h1></header>
        <video id="video" controls autoplay playsinline></video>
        <div id="status" style="padding:10px; font-size:12px; color:#888;">Carregando sinal...</div>
        <div class="placar">
            <div class="times">
                <div><img id="l_c"><p id="n_c">---</p></div>
                <div><div class="vs">VS</div></div>
                <div><img id="l_f"><p id="n_f">---</p></div>
            </div>
        </div>
        <button class="btn-pix" onclick="copiar()">APOIAR VIA PIX</button>
    </div>

<script>
    async function carregar() {
        const url = "https://raw.githubusercontent.com/cristianalvesdacosta-dot/jogo.json/main/jogo.json?v=" + Date.now();
        try {
            const r = await fetch(url);
            const d = await r.json();
            
            document.getElementById('n_c').innerText = d.timeCasa;
            document.getElementById('l_c').src = d.logoCasa;
            document.getElementById('n_f').innerText = d.timeFora;
            document.getElementById('l_f').src = d.logoFora;
            window.px = d.pix;

            let sinal = d.linkVideo;
            // Proxy para tentar pular o bloqueio do servidor
            const proxy = "https://api.allorigins.win/raw?url=" + encodeURIComponent(sinal);
            
            const v = document.getElementById('video');
            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(proxy);
                hls.attachMedia(v);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    document.getElementById('status').innerText = "Sinal Online ✅";
                    v.play();
                });
                hls.on(Hls.Events.ERROR, () => {
                    document.getElementById('status').innerText = "Erro: O servidor bloqueou o acesso do site. ❌";
                });
            }
        } catch (e) {
            document.getElementById('status').innerText = "Erro no arquivo jogo.json! Verifique as vírgulas.";
        }
    }
    function copiar() { navigator.clipboard.writeText(window.px); alert('PIX Copiado!'); }
    carregar();
</script>
</body>
</html>
