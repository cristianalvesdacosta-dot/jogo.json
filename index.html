<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveGol | Transmissão Ao Vivo</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --verde: #22c55e; --fundo: #0a0a0a; --card: #171717; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--fundo); color: white; margin: 0; padding: 0; }
        .container { width: 100%; max-width: 450px; margin: auto; min-height: 100vh; display: flex; flex-direction: column; }
        
        /* BANNER LIVEGOL */
        .header-banner { padding: 15px; text-align: center; background: #111; border-bottom: 2px solid var(--verde); display: flex; justify-content: center; align-items: center; gap: 8px; }
        .logo-texto { font-size: 26px; font-weight: 900; font-style: italic; margin: 0; }
        .cor-verde { color: var(--verde); }

        /* PLAYER UNIVERSAL */
        .video-box { width: 100%; background: #000; aspect-ratio: 16/9; position: relative; }
        video { width: 100%; height: 100%; display: block; }

        /* MENSAGEM DE INCENTIVO */
        .apoio-box { padding: 15px; background: #1a1a1a; margin: 15px; border-radius: 10px; border: 1px solid #333; text-align: center; }
        #texto_incentivo { font-size: 13px; color: #eee; margin: 0; line-height: 1.4; }

        /* PLACAR */
        .placar { padding: 20px 10px; background: var(--card); margin: 0 15px 15px 15px; border-radius: 12px; border: 1px solid #262626; }
        .times-row { display: flex; justify-content: space-around; align-items: center; }
        .time-bloco { width: 35%; text-align: center; }
        .time-bloco img { width: 50px; height: 50px; object-fit: contain; margin-bottom: 5px; }
        .time-bloco p { font-weight: bold; font-size: 12px; margin: 0; text-transform: uppercase; }
        .vs-info { text-align: center; }
        .vs-txt { font-size: 18px; font-weight: 900; color: var(--verde); }
        .live-tag { background: var(--verde); color: black; font-size: 9px; font-weight: 900; padding: 2px 5px; border-radius: 3px; margin-top: 4px; }

        /* DATA E HORA */
        .data-hora-box { text-align: center; margin-bottom: 15px; }
        #data_hora_jogo { font-size: 13px; color: #888; font-weight: bold; }

        /* PIX */
        .pix-area { margin-top: auto; padding: 20px; background: #111; border-top: 1px solid #262626; }
        .btn-pix { background: var(--verde); color: black; border: none; padding: 18px; width: 100%; border-radius: 10px; font-weight: 900; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <header class="header-banner">
            <h1 class="logo-texto">⚽ Live<span class="cor-verde">Gol</span></h1>
        </header>

        <div class="video-box"><video id="video" controls playsinline></video></div>
        
        <div class="apoio-box">
            <p id="texto_incentivo">Carregando mensagem...</p>
        </div>

        <div class="placar">
            <div class="times-row">
                <div class="time-bloco"><img id="img_casa"><p id="nome_casa">CASA</p></div>
                <div class="vs-info"><div class="vs-txt">VS</div><div class="live-tag">AO VIVO</div></div>
                <div class="time-bloco"><img id="img_fora"><p id="nome_fora">FORA</p></div>
            </div>
        </div>

        <div class="data-hora-box">
            <span id="data_hora_jogo">--/-- às --:--</span>
        </div>

        <div class="pix-area">
            <button class="btn-pix" onclick="copiarPix()">APOIAR TRANSMISSÃO (PIX)</button>
        </div>
    </div>

    <script>
        async function carregarJogo() {
            try {
                // Força o navegador a buscar a versão mais recente do JSON sem cache
                const url = "https://raw.githubusercontent.com/cristianalvesdacosta-dot/jogo.json/main/jogo.json?v=" + Date.now();
                const res = await fetch(url);
                const d = await res.json();
                
                // Preenche os textos
                document.getElementById('nome_casa').innerText = d.timeCasa;
                document.getElementById('img_casa').src = d.logoCasa;
                document.getElementById('nome_fora').innerText = d.timeFora;
                document.getElementById('img_fora').src = d.logoFora;
                document.getElementById('data_hora_jogo').innerText = d.dataHora;
                document.getElementById('texto_incentivo').innerText = d.mensagemIncentivo;
                window.chavePix = d.pix;

                // Configura o Player
                const video = document.getElementById('video');
                const videoSrc = d.linkVideo;

                if (Hls.isSupported()) {
                    const hls = new Hls();
                    hls.loadSource(videoSrc);
                    hls.attachMedia(video);
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = videoSrc;
                }
            } catch (error) {
                console.error("Erro ao carregar o jogo.json");
            }
        }

        function copiarPix() {
            navigator.clipboard.writeText(window.chavePix);
            alert("Chave PIX copiada! Valeu pelo apoio.");
        }

        carregarJogo();
    </script>
</body>
</html>
