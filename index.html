<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador LiveGol | Oficial</title>
    <style>
        :root { --verde: #22c55e; --fundo: #0a0a0a; --input: #1a1a1a; }
        body { font-family: sans-serif; background: var(--fundo); color: white; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .box { background: #111; padding: 20px; border-radius: 12px; border: 1px solid var(--verde); width: 100%; max-width: 500px; }
        h2 { color: var(--verde); text-align: center; margin-top: 0; }
        label { display: block; margin: 10px 0 5px; font-size: 12px; color: #888; text-transform: uppercase; }
        input, textarea { width: 100%; padding: 12px; background: var(--input); border: 1px solid #333; color: white; border-radius: 6px; box-sizing: border-box; }
        input:focus { border-color: var(--verde); outline: none; }
        button { width: 100%; padding: 15px; background: var(--verde); border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 20px; transition: 0.3s; }
        button:hover { background: #1ba94c; }
        #resultado { margin-top: 20px; width: 100%; background: #000; color: #22c55e; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 12px; white-space: pre-wrap; border: 1px solid #222; display: none; }
    </style>
</head>
<body>

    <div class="box">
        <h2>⚽ GERADOR LIVEGOL</h2>
        
        <div style="display: flex; gap: 10px;">
            <div style="flex: 1;">
                <label>Time Casa:</label>
                <input type="text" id="timeCasa" placeholder="Ex: Remo">
            </div>
            <div style="flex: 1;">
                <label>Time Fora:</label>
                <input type="text" id="timeFora" placeholder="Ex: Paysandu">
            </div>
        </div>

        <label>URL Logo Casa (.png):</label>
        <input type="text" id="logoCasa" placeholder="https://i.ibb.co/...">

        <label>URL Logo Fora (.png):</label>
        <input type="text" id="logoFora" placeholder="https://i.ibb.co/...">

        <label>Link do Vídeo (M3U8 ou TS):</label>
        <input type="text" id="linkVideo" placeholder="http://servidor.online:80/live/...">

        <label>Chave PIX:</label>
        <input type="text" id="pix" placeholder="Sua chave copia e cola">

        <button onclick="gerarJSON()">GERAR E COPIAR JSON</button>

        <div id="resultado"></div>
    </div>

    <script>
        function gerarJSON() {
            const dados = {
                timeCasa: document.getElementById('timeCasa').value || "Time Casa",
                logoCasa: document.getElementById('logoCasa').value || "https://via.placeholder.com/150",
                timeFora: document.getElementById('timeFora').value || "Time Fora",
                logoFora: document.getElementById('logoFora').value || "https://via.placeholder.com/150",
                linkVideo: document.getElementById('linkVideo').value,
                pix: document.getElementById('pix').value || "Chave não informada"
            };

            const jsonFinal = JSON.stringify(dados, null, 2);
            const areaResultado = document.getElementById('resultado');
            
            areaResultado.innerText = jsonFinal;
            areaResultado.style.display = 'block';

            // Copiar automaticamente
            navigator.clipboard.writeText(jsonFinal).then(() => {
                alert("JSON Gerado e Copiado! Agora cole no seu arquivo jogo.json lá no GitHub.");
            });
        }
    </script>

</body>
</html>
