<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveGol | Ao Vivo</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --verde: #22c55e; --fundo: #0a0a0a; --card: #171717; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--fundo); color: white; margin: 0; padding: 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 450px; min-height: 100vh; display: flex; flex-direction: column; }
        
        /* BANNER ESTILIZADO EM TEXTO (NUNCA SOME) */
        .header-banner { 
            padding: 25px 10px; 
            text-align: center; 
            background: #111; 
            border-bottom: 2px solid var(--verde);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .logo-texto { 
            font-size: 32px; 
            font-weight: 900; 
            font-style: italic; 
            letter-spacing: -1px;
            margin: 0;
        }
        .cor-branca { color: white; }
        .cor-verde { color: var(--verde); text-shadow: 0 0 10px rgba(34, 197, 94, 0.5); }
        .bola-icone { font-size: 24px; animation: rotate 5s linear infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .video-box { width: 100%; background: #000; }
        video { width: 100%; display: block; }

        .placar { padding: 25px 15px; background: var(--card); margin: 15px; border-radius: 15px; border: 1px solid #262626; }
        .times-row { display: flex; justify-content: space-around; align-items: center; }
        .time-bloco { width: 35%; text-align: center; }
        .time-bloco img { width: 60px; height: 60px; object-fit: contain; margin-bottom: 8px; }
        .time-bloco p { font-weight: bold; font-size: 13px; margin: 0; text-transform: uppercase; }
        .vs { font-size: 22px; font-weight: 900; color: var(--verde); font-style: italic; }
        .live-tag { background: var(--verde); color: black; font-size: 10px; font-weight: 900; padding: 2px 8px; border-radius: 4px; margin-top: 5px; animation: blink 1.2s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        .details { padding: 0 20px; text-align: left; }
        .details h1 { font-size: 18px; margin: 0; }
        .details p { font-size: 12px; color: #888; margin: 5px 0 0 0; }

        .pix-area { margin-top: auto; padding: 20px; background: #111; border-top: 1px solid #262626; }
        .pix-box { background: #1e1e1e; padding: 12px; border-radius: 8px; font-size: 11px; color: #888; border: 1px dashed #444; margin-bottom: 15px; word-break: break-all; }
        .btn-pix { background: var(--verde); color: black; border: none; padding: 18px; width: 100%; border-radius: 10px; font-weight: 900; font-size: 16px; cursor: pointer; }
        
        #loading { display: flex; align-items: center; justify-content: center; height: 100vh; color: var(--verde); font-weight: bold; }
    </style>
</head>
<body>
    <div id="loading">LIVEGOL...</div>
    <div class="container" id="conteudo" style="display:none;">
        
        <header class="header-banner">
            <span class="bola-icone">⚽</span>
            <h1 class="logo-texto">
                <span class="cor-branca">Live</span><span class="cor-verde">Gol</span>
            </h1>
        </header>

        <div class="video-box"><video id="video" controls playsinline></video></div>
        
        <div class="placar">
            <div class="times-row">
                <div class="time-bloco"><img id="img_casa" src=""><p id="nome_casa"></p></div>
                <div class="vs-bloco"><div class="vs">VS</div><div class="live-tag">AO VIVO</div></div>
                <div class="time-bloco"><img id="img_fora" src=""><p id="nome_fora"></p></div>
            </div>
        </div>

        <div class="details"><h1 id="titulo_jogo"></h1><p id="data_jogo"></p></div>

        <div class="pix-area">
            <div class="pix-box" id="pix_text"></div>
            <button class="btn-pix" onclick="copiarPix()">COPIAR PIX COPIA E COLA</button>
        </div>
    </div>

    <script>
        const jsonUrl = "https://raw.githubusercontent.com/cristianalvesdacosta-dot/jogo.json/main/jogo.json";
        async function init() {
            try {
                const res = await fetch(jsonUrl + "?v=" + Date.now());
                const d = await res.json();
                document.getElementById('nome_casa').innerText = d.timeCasa;
                document.getElementById('img_casa').src = d.logoCasa;
                document.getElementById('nome_fora').innerText = d.timeFora;
                document.getElementById('img_fora').src = d.logoFora;
                document.getElementById('titulo_jogo').innerText = d.timeCasa + " x " + d.timeFora;
                document.getElementById('data_jogo').innerText = d.dataHora;
                document.getElementById('pix_text').innerText = d.pix;
                window.chavePix = d.pix;
                const v = document.getElementById('video');
                if (Hls.isSupported()) { 
                    const hls = new Hls(); hls.loadSource(d.linkVideo); hls.attachMedia(v); 
                } else if (v.canPlayType('application/vnd.apple.mpegurl')) { 
                    v.src = d.linkVideo; 
                }
                document.getElementById('loading').style.display = 'none';
                document.getElementById('conteudo').style.display = 'flex';
            } catch (e) { document.getElementById('loading').innerText = "ERRO NO SINAL."; }
        }
        function copiarPix() { navigator.clipboard.writeText(window.chavePix); alert("PIX Copiado!"); }
        init();
    </script>
</body>
</html>
