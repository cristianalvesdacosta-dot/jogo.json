<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveGol | Oficial</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --verde: #22c55e; --fundo: #0a0a0a; }
        body { background: var(--fundo); color: #fff; font-family: sans-serif; margin: 0; text-align: center; }
        .container { width: 100%; max-width: 450px; margin: auto; min-height: 100vh; display: flex; flex-direction: column; }
        
        .header { padding: 15px; border-bottom: 2px solid var(--verde); background: #111; font-style: italic; }
        h1 { margin: 0; font-size: 24px; }

        /* Video Player */
        .video-wrapper { width: 100%; aspect-ratio: 16/9; background: #000; position: relative; }
        video { width: 100%; height: 100%; display: block; }
        #status { position: absolute; bottom: 10px; left: 10px; font-size: 11px; color: var(--verde); background: rgba(0,0,0,0.6); padding: 2px 8px; border-radius: 4px; }

        /* Placar */
        .placar { background: #111; margin: 15px; padding: 20px; border-radius: 12px; border: 1px solid #222; }
        .times { display: flex; justify-content: space-around; align-items: center; }
        .time { width: 35%; }
        .time img { width: 60px; height: 60px; object-fit: contain; margin-bottom: 8px; }
        .time p { margin: 0; font-weight: bold; font-size: 14px; text-transform: uppercase; }
        .vs-box { text-align: center; }
        .vs-text { color: var(--verde); font-weight: 900; font-size: 22px; }
        .ao-vivo { background: var(--verde); color: #000; font-size: 10px; font-weight: 900; padding: 2px 6px; border-radius: 3px; margin-top: 5px; }

        /* Botão Pix */
        .footer { margin-top: auto; padding: 20px; }
        .btn-pix { background: var(--verde); color: #000; border: none; padding: 18px; width: 100%; border-radius: 10px; font-weight: 900; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .btn-pix:active { transform: scale(0.95); }
    </style>
</head>
<body>

<div class="container">
    <header class="header"><h1>⚽ LIVE<span style="color:var(--verde)">GOL</span></h1></header>

    <div class="video-wrapper">
        <video id="video" controls autoplay playsinline></video>
        <div id="status">Iniciando transmissão...</div>
    </div>

    <div class="placar">
        <div class="times">
            <div class="time">
                <img src="https://i.ibb.co/3Y7Xv3m/remo.png" id="img_c">
                <p id="nome_c">REMO</p>
            </div>

            <div class="vs-box">
                <div class="vs-text">VS</div>
                <div class="ao-vivo">AO VIVO</div>
            </div>

            <div class="time">
                <img src="https://i.ibb.co/L9Y0X8p/paysandu.png" id="img_f">
                <p id="nome_f">PAYSANDU</p>
            </div>
        </div>
    </div>

    <div class="footer">
        <button class="btn-pix" onclick="copiarPix()">APOIAR VIA PIX</button>
    </div>
</div>

<script>
    // ==========================================
    // CONFIGURAÇÃO MANUAL (EDITE AQUI)
    // ==========================================
    const CONFIG = {
        timeCasa: "REMO",
        logoCasa: "https://i.ibb.co/3Y7Xv3m/remo.png",
        timeFora: "PAYSANDU",
        logoFora: "https://i.ibb.co/L9Y0X8p/paysandu.png",
        // COLE O LINK DO VÍDEO ABAIXO
        linkVideo: "COLE_AQUI_O_LINK_M3U8", 
        pix: "SUA_CHAVE_PIX_AQUI"
    };

    // ==========================================
    // LÓGICA DO PLAYER (NÃO MEXER)
    // ==========================================
    function iniciarApp() {
        document.getElementById('nome_c').innerText = CONFIG.timeCasa;
        document.getElementById('img_c').src = CONFIG.logoCasa;
        document.getElementById('nome_f').innerText = CONFIG.timeFora;
        document.getElementById('img_f').src = CONFIG.logoFora;

        const video = document.getElementById('video');
        const status = document.getElementById('status');
        
        // Proxy para tentar pular bloqueio de Referer/CORS
        const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(CONFIG.linkVideo);

        if (Hls.isSupported()) {
            const hls = new Hls({
                xhrSetup: function(xhr) {
                    xhr.withCredentials = false;
                }
            });
            hls.loadSource(proxyUrl);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                status.innerText = "Sinal Estabilizado ✅";
                video.play().catch(() => {
                    status.innerText = "Clique no Play para assistir";
                });
            });
            hls.on(Hls.Events.ERROR, (event, data) => {
                if(data.fatal) status.innerText = "Erro: Servidor bloqueou o site ❌";
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = proxyUrl;
        }
    }

    function copiarPix() {
        navigator.clipboard.writeText(CONFIG.pix);
        alert("Chave PIX Copiada!");
    }

    window.onload = iniciarApp;
</script>

</body>
</html>
