<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveGol | Transmissão</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; text-align: center; }
        .video-container { width: 100%; max-width: 500px; margin: auto; }
        video { width: 100%; aspect-ratio: 16/9; background: #111; }
        .btn-pix { background: #22c55e; border: none; padding: 15px; width: 90%; border-radius: 8px; font-weight: bold; margin-top: 20px; cursor: pointer; }
        .placar-simples { padding: 20px; border: 1px solid #333; margin: 10px; border-radius: 10px; }
    </style>
</head>
<body>

<div class="video-container">
    <header style="padding:15px;"><h1>⚽ LIVE<span style="color:#22c55e">GOL</span></h1></header>
    
    <video id="video" controls autoplay playsinline></video>
    
    <div id="status" style="font-size: 12px; color: #888; padding: 10px;">Conectando ao servidor...</div>

    <div class="placar-simples">
        <div style="display:flex; justify-content: space-around; align-items:center;">
            <div><img id="img_c" width="40"><p id="t_c"></p></div>
            <div style="color:#22c55e; font-weight:bold;">VS</div>
            <div><img id="img_f" width="40"><p id="t_f"></p></div>
        </div>
    </div>

    <button class="btn-pix" onclick="copiarPix()">APOIAR VIA PIX</button>
</div>

<script>
    async function iniciar() {
        const url_json = "https://raw.githubusercontent.com/cristianalvesdacosta-dot/jogo.json/main/jogo.json?v=" + Date.now();
        
        try {
            const r = await fetch(url_json);
            const d = await r.json();

            document.getElementById('t_c').innerText = d.timeCasa;
            document.getElementById('img_c').src = d.logoCasa;
            document.getElementById('t_f').innerText = d.timeFora;
            document.getElementById('img_f').src = d.logoFora;
            window.pix = d.pix;

            const video = document.getElementById('video');
            let m3u8 = d.linkVideo;

            // TESTE DE BYPASS 2: Usando o proxy de demonstração do Cloudflare
            // Se o link original falhar, ele tenta camuflar a origem
            const proxy_url = "https://api.allorigins.win/raw?url=" + encodeURIComponent(m3u8);

            if (Hls.isSupported()) {
                const hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    backBufferLength: 90
                });
                
                // Tentamos carregar via Proxy primeiro para garantir que o GitHub aceite
                hls.loadSource(proxy_url);
                hls.attachMedia(video);
                
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    document.getElementById('status').innerText = "Sinal Estabilizado ✅";
                    video.play();
                });

                hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.details === 'manifestLoadError') {
                        document.getElementById('status').innerText = "Erro: O servidor de IPTV bloqueou o site. ❌";
                    }
                });
            }
        } catch (e) {
            document.getElementById('status').innerText = "Erro ao ler o arquivo JSON.";
        }
    }

    function copiarPix() { navigator.clipboard.writeText(window.pix); alert("Copiado!"); }
    
    iniciar();
</script>

</body>
</html>
