<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador LiveGol | Simplificado</title>
    <style>
        body { font-family: sans-serif; background: #0a0a0a; color: white; padding: 20px; text-align: center; }
        .box { background: #111; padding: 20px; border-radius: 15px; border: 1px solid #22c55e; max-width: 500px; margin: auto; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #22c55e; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        #output { margin-top: 20px; background: #000; padding: 15px; border-radius: 8px; color: #22c55e; font-family: monospace; font-size: 12px; text-align: left; white-space: pre-wrap; display: none; border: 1px solid #222; }
    </style>
</head>
<body>

<div class="box">
    <h2>🚀 GERADOR DE JOGO</h2>
    <input type="text" id="casa" placeholder="Nome Time Casa (Ex: Remo)">
    <input type="text" id="l_casa" placeholder="Link Logo Casa (.png)">
    <input type="text" id="fora" placeholder="Nome Time Fora (Ex: Paysandu)">
    <input type="text" id="l_fora" placeholder="Link Logo Fora (.png)">
    <input type="text" id="video" placeholder="Link do Vídeo (M3U8)">
    <input type="text" id="pix" placeholder="Sua Chave PIX">
    
    <button onclick="gerar()">GERAR E COPIAR JSON</button>
    <div id="output"></div>
</div>

<script>
    function gerar() {
        const dados = {
            "timeCasa": document.getElementById('casa').value || "Time Casa",
            "logoCasa": document.getElementById('l_casa').value || "https://via.placeholder.com/150",
            "timeFora": document.getElementById('fora').value || "Time Fora",
            "logoFora": document.getElementById('l_fora').value || "https://via.placeholder.com/150",
            "linkVideo": document.getElementById('video').value.trim(),
            "pix": document.getElementById('pix').value || "Chave Pix"
        };

        const resultado = JSON.stringify(dados, null, 2);
        document.getElementById('output').innerText = resultado;
        document.getElementById('output').style.display = 'block';

        navigator.clipboard.writeText(resultado).then(() => {
            alert("JSON copiado! Agora cole no seu arquivo jogo.json e salve.");
        });
    }
</script>

</body>
</html>
